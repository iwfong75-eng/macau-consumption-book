name: CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          zip \
          unzip \
          autoconf \
          libtool \
          libltdl-dev \
          pkg-config \
          zlib1g-dev \
          libffi-dev \
          libssl-dev \
          libstdc++6 \
          libbz2-dev \
          libreadline-dev \
          libsqlite3-dev \
          cmake \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo6 \
          libc6:i386 \
          libstdc++6:i386 \
          zlib1g:i386

    - name: Install Python build tools
      run: |
        python -m pip install --upgrade pip
        pip install Cython==0.29.36 buildozer
        # 強制安裝最新 master 分支的 python-for-android 與 ptxprint/setuptools 相關相容工具
        pip install --upgrade git+https://github.com/kivy/python-for-android.git@master

    - name: Build with Buildozer
      run: |
        # 清理舊快取
        rm -rf ~/.buildozer
        # 透過環境變數或命令列確保建立 venv 時使用的 pip 版本受控
        buildozer android debug
